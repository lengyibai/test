<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Double Spin</title>
  </head>
  <body>
    <script>
      (() => {
        const inviteCode = new URLSearchParams(window.location.search).get(
          "dbs_invite_code",
        );
        if (!inviteCode) return;

        window.location.replace(
          `doublespinweb://open?dbs_invite_code=${encodeURIComponent(
            inviteCode,
          )}`,
        );
      })();
    </script>
  </body>
</html>
